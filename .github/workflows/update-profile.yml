# Weekly refresh of the "Recent public activity" section in README.md.
# Reads public GitHub data only, uses the built-in GITHUB_TOKEN, and needs no paid services.
# Commits are authored by github-actions[bot], so they never count toward my contribution graph.
name: Update profile activity

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write          # only needs to push README.md to this repo

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh activity section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repos to hide, set under Settings > Secrets and variables > Actions > Variables
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
        run: python scripts/update_profile.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update public activity section"
            git push
          fi
